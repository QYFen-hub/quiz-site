<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1026">
<title>职业兴趣测试 · 霍兰德 RIASEC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  color:#eef1ff;
  min-height:100vh;
  background:
    radial-gradient(1200px 800px at 85% -10%, rgba(124,108,255,.28), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, rgba(77,208,225,.16), transparent 55%),
    linear-gradient(160deg,#0b1026 0%,#141a38 55%,#10142c 100%);
  background-attachment:fixed;
}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.screen{display:none;width:100%;max-width:760px}
.screen.active{display:block;animation:screenIn .45s cubic-bezier(.22,.8,.32,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.12);
  border-radius:24px;
  box-shadow:0 24px 60px rgba(3,6,20,.55), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:40px 36px;
}
@media(max-width:560px){.card{padding:28px 20px}}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:inherit;font-size:16px;font-weight:600;letter-spacing:.04em;color:#fff;
  padding:14px 34px;border:none;border-radius:999px;cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease, background .18s ease;
}
.btn-primary{background:linear-gradient(135deg,#7c6cff 0%,#4dd0e1 100%);box-shadow:0 10px 26px rgba(100,120,255,.35)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 32px rgba(100,120,255,.45)}
.btn-primary:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.12)}

/* ---------- 首页 ---------- */
.home-card{text-align:center;padding:52px 40px}
.logo{width:72px;height:72px;margin:0 auto 24px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#7c6cff,#4dd0e1);box-shadow:0 12px 30px rgba(100,120,255,.4)}
h1{font-size:34px;font-weight:800;letter-spacing:.02em;
  background:linear-gradient(120deg,#ffffff 30%,#c9d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:#aab2d6;line-height:1.9;margin:18px auto 26px;max-width:540px;font-size:15.5px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{font-size:13px;color:#c7cdf0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);padding:7px 16px;border-radius:999px}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 32px;max-width:560px}
.dim-tile{padding:14px 8px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);text-align:center;transition:all .2s ease}
.dim-tile:hover{border-color:rgba(140,150,255,.4);transform:translateY(-2px)}
.dim-tile b{display:block;font-size:19px;margin-bottom:4px;background:linear-gradient(135deg,#a89bff,#6fdcf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.dim-tile span{font-size:12.5px;color:#9aa3c7}
.note{margin-top:20px;font-size:13px;color:#7f88b3}
@media(max-width:560px){h1{font-size:26px}.home-card{padding:36px 22px}.dims{grid-template-columns:repeat(2,1fr)}}

/* ---------- 测试页 ---------- */
.q-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#9aa3c7;margin-bottom:10px}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:30px}
.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7c6cff,#4dd0e1);transition:width .35s ease}
#qText{font-size:21px;line-height:1.65;margin-bottom:26px;min-height:66px;font-weight:600}
.opts{display:grid;gap:14px;margin-bottom:32px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  font-family:inherit;padding:16px 18px;font-size:15.5px;color:#dfe4ff;line-height:1.55;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:16px;cursor:pointer;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
}
.opt:hover{border-color:rgba(140,150,255,.45);transform:translateY(-2px)}
.opt .key{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#aeb6e0;background:rgba(255,255,255,.08);transition:all .18s ease}
.opt.selected{
  border-color:transparent;
  background:linear-gradient(rgba(20,24,48,.92),rgba(20,24,48,.92)) padding-box,linear-gradient(135deg,#7c6cff,#4dd0e1) border-box;
  box-shadow:0 8px 24px rgba(100,120,255,.28);
}
.opt.selected .key{background:linear-gradient(135deg,#7c6cff,#4dd0e1);color:#fff}
.opt.selected{animation:selPulse .28s ease}
@keyframes selPulse{0%{transform:scale(.985)}60%{transform:scale(1.012)}100%{transform:scale(1)}}
.swap-anim{animation:qIn .3s ease both}
@keyframes qIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.q-nav{display:flex;justify-content:space-between;gap:14px}
@media(max-width:560px){#qText{font-size:18px;min-height:80px}.btn{padding:13px 26px;font-size:15px}}

/* ---------- 结果页 ---------- */
.result-card{padding:44px 40px}
@media(max-width:560px){.result-card{padding:32px 20px}}
.r-eyebrow{text-align:center;color:#8f97c4;font-size:13px;letter-spacing:.3em}
.r-code{display:flex;justify-content:center;gap:10px;margin:18px 0 10px}
.r-code span{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c6cff,#4dd0e1);
  box-shadow:0 10px 24px rgba(100,120,255,.35);animation:popIn .5s cubic-bezier(.2,.9,.3,1.4) both}
.r-code span:nth-child(2){animation-delay:.1s}
.r-code span:nth-child(3){animation-delay:.2s}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
#rTitle{text-align:center;font-size:27px;font-weight:800}
.r-tagline{text-align:center;color:#aab2d6;margin:12px auto 24px;max-width:560px;line-height:1.8;font-size:15.5px}
.r-combo{margin:0 auto 24px;max-width:640px;padding:14px 18px;border-radius:14px;
  background:rgba(124,108,255,.12);border:1px solid rgba(124,108,255,.35);color:#cfd4ff;font-size:14.5px;line-height:1.85}
.r-combo strong{color:#fff}
.r-chart{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
.bars{display:grid;gap:11px;flex:1;min-width:250px}
.bar-row{display:grid;grid-template-columns:88px 1fr 34px;align-items:center;gap:12px;font-size:13.5px;color:#c3c9ec}
.bar-row .bar-val{text-align:right;color:#8f97c4;font-variant-numeric:tabular-nums}
.bar-row.top{color:#fff;font-weight:700}
.bar-row.top .bar-val{color:#fff}
.bar-track{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,#7c6cff,#4dd0e1);
  transition:width .9s cubic-bezier(.22,.8,.32,1)}
.bar-row.top .bar-fill{background:linear-gradient(90deg,#ffd166,#ff9a62)}
.r-grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
@media(max-width:640px){.r-grid2{grid-template-columns:1fr}}
.r-section{margin-top:22px;padding:24px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09)}
.r-grid2 .r-section{margin-top:0}
.r-section h3{display:flex;align-items:center;gap:10px;font-size:17px;margin-bottom:14px;color:#e8ebff}
.r-section h3 svg{color:#8f9bff;flex:0 0 auto}
.r-section p{color:#b7bee4;line-height:1.9;font-size:15px}
.r-section ul{list-style:none;display:grid;gap:9px}
.r-section li{position:relative;padding-left:20px;color:#b7bee4;line-height:1.7;font-size:14.5px}
.r-section li::before{content:"";position:absolute;left:0;top:10px;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,#7c6cff,#4dd0e1)}
.career-group{margin-bottom:16px}
.career-group:last-child{margin-bottom:0}
.career-group h4{font-size:14px;color:#9aa3c7;margin-bottom:10px;font-weight:600}
.career-tags{display:flex;flex-wrap:wrap;gap:10px}
.career-tags span{padding:8px 16px;border-radius:999px;font-size:14px;color:#dfe4ff;
  background:rgba(77,208,225,.1);border:1px solid rgba(77,208,225,.3)}
#btnRestart{margin:34px auto 0;display:flex}
canvas{display:block}
</style>
</head>
<body>
<main class="wrap">

  <!-- ============ 首页 ============ -->
  <section id="screen-home" class="screen active">
    <div class="card home-card">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round">
          <path d="M12 2 21 7v10l-9 5-9-5V7z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <h1>发现你的职业兴趣密码</h1>
      <p class="subtitle">
        这是一份基于<b>霍兰德职业兴趣理论（RIASEC 模型）</b>的测试，将职业兴趣划分为六大维度。
        共 18 道选择题，大约需要 3–5 分钟。测试结束后，你将获得专属的兴趣画像、
        六维度得分图谱、匹配的职业方向与发展建议。
      </p>
      <div class="chips">
        <span class="chip">18 道精选题</span>
        <span class="chip">约 3–5 分钟</span>
        <span class="chip">6 大兴趣维度</span>
        <span class="chip">结果即时生成</span>
      </div>
      <div class="dims">
        <div class="dim-tile"><b>R</b><span>现实型</span></div>
        <div class="dim-tile"><b>I</b><span>研究型</span></div>
        <div class="dim-tile"><b>A</b><span>艺术型</span></div>
        <div class="dim-tile"><b>S</b><span>社会型</span></div>
        <div class="dim-tile"><b>E</b><span>企业型</span></div>
        <div class="dim-tile"><b>C</b><span>常规型</span></div>
      </div>
      <button class="btn btn-primary" id="btnStart">开始测试</button>
      <p class="note">答案没有对错之分，请凭第一直觉作答</p>
    </div>
  </section>

  <!-- ============ 测试页 ============ -->
  <section id="screen-quiz" class="screen">
    <div class="card quiz-card">
      <div class="q-top">
        <span id="qStep">第 1 / 18 题</span>
        <span id="qPct">6%</span>
      </div>
      <div class="progress"><div class="progress-fill" id="qProgress"></div></div>
      <div id="qBody">
        <h2 id="qText"></h2>
        <div id="qOpts" class="opts"></div>
      </div>
      <div class="q-nav">
        <button class="btn btn-ghost" id="btnPrev">上一题</button>
        <button class="btn btn-primary" id="btnNext">下一题</button>
      </div>
    </div>
  </section>

  <!-- ============ 结果页 ============ -->
  <section id="screen-result" class="screen">
    <div class="card result-card">
      <p class="r-eyebrow">你的职业兴趣类型</p>
      <div class="r-code" id="rCode"></div>
      <h2 id="rTitle"></h2>
      <p class="r-tagline" id="rTagline"></p>
      <div id="rCombo" class="r-combo" hidden></div>

      <div class="r-chart">
        <canvas id="radar" width="640" height="640" style="width:300px;height:300px;max-width:100%"></canvas>
        <div class="bars" id="bars"></div>
      </div>

      <div class="r-section">
        <h3>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
          性格与工作风格
        </h3>
        <p id="styleText"></p>
      </div>

      <div class="r-grid2">
        <div class="r-section">
          <h3>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
            核心优势
          </h3>
          <ul id="strengthList"></ul>
        </div>
        <div class="r-section">
          <h3>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 22 20H2z"/><line x1="12" y1="9" x2="12" y2="14"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            潜在短板
          </h3>
          <ul id="challengeList"></ul>
        </div>
      </div>

      <div class="r-section">
        <h3>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          匹配职业方向
        </h3>
        <div id="careerWrap"></div>
      </div>

      <div class="r-section">
        <h3>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z"/></svg>
          发展建议
        </h3>
        <p id="adviceText"></p>
      </div>

      <button class="btn btn-primary" id="btnRestart">重新测试</button>
    </div>
  </section>

</main>

<script>
/* ================= 题目数据 =================
   18 题 = 6 个维度 × 3 题。
   每题 4 个选项，对所属维度分别赋权重 3 / 2 / 1 / 0。
   每个维度满分 9 分（3 题 × 3 分），最低 0 分。 */
var DIMS = ["R","I","A","S","E","C"];
var DIM_LABEL = {R:"现实 R", I:"研究 I", A:"艺术 A", S:"社会 S", E:"企业 E", C:"常规 C"};

var QUESTIONS = [
  /* ---- R 现实型 ---- */
  { dim:"R", text:"假期里你最想做的一件事是？", opts:[
    {t:"动手组装一套模型，或修理一件旧物", w:3},
    {t:"在家整理工具、给绿植换盆", w:1},
    {t:"去郊外徒步、露营或骑行", w:2},
    {t:"窝在沙发里看剧、刷手机", w:0}
  ]},
  { dim:"R", text:"面对一台出故障的小家电，你通常会——", opts:[
    {t:"直接送修或干脆买新的", w:0},
    {t:"立刻拆开研究，尝试自己修好", w:3},
    {t:"查教程，跟着步骤动手试一试", w:2},
    {t:"拍打几下碰碰运气", w:1}
  ]},
  { dim:"R", text:"下列哪类活动最吸引你？", opts:[
    {t:"种植花草、照料宠物", w:2},
    {t:"木工、烹饪、汽修等实操课程", w:3},
    {t:"线上知识讲座", w:0},
    {t:"户外拓展训练", w:1}
  ]},
  /* ---- I 研究型 ---- */
  { dim:"I", text:"遇到一个好奇的现象（比如“为什么天空是蓝色的”），你会——", opts:[
    {t:"搜索几篇文章，大致弄明白", w:2},
    {t:"查文献找资料，一定要搞懂背后原理", w:3},
    {t:"想一下，有自己的猜测就满足了", w:1},
    {t:"不太在意，知道是什么就行", w:0}
  ]},
  { dim:"I", text:"你更喜欢哪类工作内容？", opts:[
    {t:"整理资料、归纳信息", w:1},
    {t:"设计实验、分析数据、验证假设", w:3},
    {t:"执行明确指派的日常任务", w:0},
    {t:"研究案例、撰写分析报告", w:2}
  ]},
  { dim:"I", text:"空闲时你更愿意——", opts:[
    {t:"钻研一道逻辑谜题或玩策略游戏", w:3},
    {t:"和朋友打游戏放松", w:0},
    {t:"看一部纪录片并思考其中观点", w:2},
    {t:"读一本小说", w:1}
  ]},
  /* ---- A 艺术型 ---- */
  { dim:"A", text:"如果给你一整天自由创作时间，你会选择——", opts:[
    {t:"随手涂鸦或写点随笔", w:1},
    {t:"写歌、画画、拍短片或做设计作品", w:3},
    {t:"布置房间、搭配一套有个性的穿搭", w:2},
    {t:"不做创作，做点别的", w:0}
  ]},
  { dim:"A", text:"看一场演出或展览时，你最关注的是——", opts:[
    {t:"作品的创意表达和艺术手法，甚至想亲自尝试", w:3},
    {t:"作品传达的情感与美感", w:2},
    {t:"陪伴同行的朋友", w:0},
    {t:"作品背后的故事", w:1}
  ]},
  { dim:"A", text:"你理想中的工作氛围是——", opts:[
    {t:"流程清晰、照章办事", w:0},
    {t:"有一定创作空间，可以提出新点子", w:2},
    {t:"鼓励天马行空，成果能体现个人风格", w:3},
    {t:"偶尔需要一点创意", w:1}
  ]},
  /* ---- S 社会型 ---- */
  { dim:"S", text:"朋友遇到烦恼找你倾诉，你通常会——", opts:[
    {t:"认真听完，给出真诚建议", w:2},
    {t:"耐心倾听，帮 TA 梳理情绪并陪伴到底", w:3},
    {t:"安慰几句，讲个笑话逗 TA 开心", w:1},
    {t:"有点不知所措，希望 TA 找更专业的人", w:0}
  ]},
  { dim:"S", text:"哪类志愿活动最吸引你？", opts:[
    {t:"去支教，或长期陪伴弱势群体", w:3},
    {t:"在活动幕后帮忙组织协调", w:1},
    {t:"参加社区服务、环保公益活动", w:2},
    {t:"捐款捐物表达心意即可", w:0}
  ]},
  { dim:"S", text:"在团队合作中，你更常扮演的角色是——", opts:[
    {t:"独立完成任务，较少关注他人", w:0},
    {t:"关心每个人的状态，主动帮助落后成员", w:3},
    {t:"乐于分享自己的经验帮助同事", w:2},
    {t:"做好自己份内的事，配合大家", w:1}
  ]},
  /* ---- E 企业型 ---- */
  { dim:"E", text:"社团要举办一场大型活动，你最想做的是——", opts:[
    {t:"担任总负责人，统筹全局、拍板决策", w:3},
    {t:"负责拉赞助、谈合作", w:2},
    {t:"负责宣传或现场执行", w:1},
    {t:"做个普通参与者就好", w:0}
  ]},
  { dim:"E", text:"面对一个有挑战的目标（如销售业绩、竞赛名次），你的反应是——", opts:[
    {t:"尽力而为，结果顺其自然", w:1},
    {t:"兴奋，立刻制定计划并全力争取第一", w:3},
    {t:"感到压力，更愿意回避竞争", w:0},
    {t:"有动力，愿意努力去争取", w:2}
  ]},
  { dim:"E", text:"你更认同哪种成就感？", opts:[

/* ================= 状态与流程 ================= */
var idx = 0;
var answers = new Array(QUESTIONS.length).fill(null);
var MAX_SCORE = 9;

function $(s){ return document.querySelector(s); }

function showScreen(name){
  var screens = document.querySelectorAll('.screen');
  for (var i=0;i<screens.length;i++) screens[i].classList.remove('active');
  $('#screen-'+name).classList.add('active');
  window.scrollTo(0,0);
}

function startQuiz(){
  idx = 0;
  for (var i=0;i<answers.length;i++) answers[i]=null;
  renderQ(true);
  showScreen('quiz');
}

function renderQ(animate){
  var q = QUESTIONS[idx];
  $('#qStep').textContent = '第 ' + (idx+1) + ' / ' + QUESTIONS.length + ' 题';
  var pct = Math.round((idx+1)/QUESTIONS.length*100);
  $('#qPct').textContent = pct + '%';
  $('#qProgress').style.width = pct + '%';
  $('#qText').textContent = q.text;

  var opts = $('#qOpts');
  opts.innerHTML = '';
  q.opts.forEach(function(o, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (answers[idx]===i ? ' selected' : '');
    var key = document.createElement('span');
    key.className = 'key';
    key.textContent = 'ABCD'[i];
    var txt = document.createElement('span');
    txt.textContent = o.t;
    b.appendChild(key); b.appendChild(txt);
    b.addEventListener('click', function(){ selectOpt(i); });
    opts.appendChild(b);
  });

  $('#btnPrev').disabled = (idx===0);
  var next = $('#btnNext');
  next.textContent = (idx===QUESTIONS.length-1) ? '查看结果' : '下一题';
  next.disabled = (answers[idx]===null);

  if (animate){
    var body = $('#qBody');
    body.classList.remove('swap-anim');
    void body.offsetWidth;
    body.classList.add('swap-anim');
  }
}

function selectOpt(i){
  answers[idx] = i;      // 允许回看时直接改选
  renderQ(false);
}

function prevQ(){ if (idx>0){ idx--; renderQ(true); } }

function nextQ(){
  if (answers[idx]===null) return;   // 未选择不能进入下一题
  if (idx < QUESTIONS.length-1){ idx++; renderQ(true); }
  else finishQuiz();
}

function finishQuiz(){
  showScreen('result');
  renderResult();
}

/* ================= 计分 ================= */
function computeScores(){
  var s = {R:0,I:0,A:0,S:0,E:0,C:0};
  QUESTIONS.forEach(function(q, i){
    s[q.dim] += q.opts[answers[i]].w;
  });
  return s;
}

/* ================= 结果渲染 ================= */
function renderResult(){
  var s = computeScores();
  var order = DIMS.slice().sort(function(a,b){ return s[b]-s[a]; });
  var top = s[order[0]];

  /* 多重类型判定：第 2 名与第 1 名相差 ≤1 分则并入，
     第 3 名与第 1 名相差 ≤2 分也并入（即霍兰德代码取前 1–3 位） */
  var code = [order[0]];
  if (s[order[1]] >= top-1) code.push(order[1]);
  if (code.length>1 && s[order[2]] >= top-2) code.push(order[2]);

  var t1 = TYPES[code[0]];

  $('#rCode').innerHTML = code.map(function(c){ return '<span>'+c+'</span>'; }).join('');
  $('#rTitle').textContent = code.length===1
    ? t1.name + ' · ' + t1.alias
    : code.map(function(c){ return TYPES[c].name; }).join(' + ') + '（' + code.join('') + ' 组合）';
  $('#rTagline').textContent = t1.portrait;

  var combo = $('#rCombo');
  if (code.length>1){
    combo.hidden = false;
    combo.innerHTML = '<strong>多重类型组合（霍兰德代码 ' + code.join('') + '）：</strong>'
      + '你的' + TYPES[code[0]].name + '与' + TYPES[code[1]].name + '得分接近，'
      + '兼具' + code.map(function(c){ return TYPES[c].combo; }).join('、') + '的特质。'
      + '单一类型不足以概括你——两类（甚至多类）交叉的领域往往更适合你。'
      + '以下分析以「' + t1.name + '」为主，并融合你的其他高分维度。';
  } else {
    combo.hidden = true;
  }

  $('#styleText').textContent = t1.style;
  fillList('#strengthList', t1.strengths);
  fillList('#challengeList', t1.challenges);

  var cw = $('#careerWrap');
  cw.innerHTML = '';
  code.slice(0, code.length===1 ? 1 : 2).forEach(function(c){
    var t = TYPES[c];
    var g = document.createElement('div');
    g.className = 'career-group';
    var h = document.createElement('h4');
    h.textContent = t.name + '（' + c + '）方向';
    var tags = document.createElement('div');
    tags.className = 'career-tags';
    t.careers.forEach(function(job){
      var sp = document.createElement('span');
      sp.textContent = job;
      tags.appendChild(sp);
    });
    g.appendChild(h); g.appendChild(tags);
    cw.appendChild(g);
  });

  $('#adviceText').textContent = t1.advice;

  renderBars(s, order[0]);
  animateRadar(s);
}

function fillList(sel, items){
  var ul = $(sel);
  ul.innerHTML = '';
  items.forEach(function(x){
    var li = document.createElement('li');
    li.textContent = x;
    ul.appendChild(li);
  });
}

function renderBars(s, topDim){
  var wrap = $('#bars');
  wrap.innerHTML = '';
  DIMS.forEach(function(d){
    var row = document.createElement('div');
    row.className = 'bar-row' + (d===topDim ? ' top' : '');
    var lb = document.createElement('span');
    lb.textContent = DIM_LABEL[d];
    var track = document.createElement('div');
    track.className = 'bar-track';
    var fill = document.createElement('div');
    fill.className = 'bar-fill';
    track.appendChild(fill);
    var val = document.createElement('span');
    val.className = 'bar-val';
    val.textContent = s[d];
    row.appendChild(lb); row.appendChild(track); row.appendChild(val);
    wrap.appendChild(row);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        fill.style.width = (s[d]/MAX_SCORE*100) + '%';
      });
    });
  });
}

/* ================= 雷达图（纯 Canvas） ================= */
function animateRadar(s){
  var cv = $('#radar');
  var ctx = cv.getContext('2d');
  var t0 = null, dur = 700;
  function frame(now){
    if (t0===null) t0 = now;
    var p = Math.min(1, (now-t0)/dur);
    drawRadar(ctx, cv, s, 1-Math.pow(1-p,3));
    if (p<1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function drawRadar(ctx, cv, s, prog){
  var W = cv.width, H = cv.height, cx = W/2, cy = H/2 + 10, R = W*0.28;
  ctx.clearRect(0,0,W,H);
  var N = 6;
  var angle = function(i){ return -Math.PI/2 + i*2*Math.PI/N; };

  // 网格环（3 / 6 / 9 分）
  [3,6,9].forEach(function(v){
    ctx.beginPath();
    for (var i=0;i<=N;i++){
      var a = angle(i%N), r = R*v/MAX_SCORE;
      var x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
      if (i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // 轴线与标签
  ctx.font = '600 24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i=0;i<N;i++){
    var a = angle(i);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
    var d = DIMS[i];
    var lx = cx + Math.cos(a)*(R+46), ly = cy + Math.sin(a)*(R+46);
    ctx.fillStyle = '#aab2d6';
    ctx.fillText(d + ' ' + TYPES[d].name, lx, ly);
  }

  // 得分多边形
  ctx.beginPath();
  for (var i2=0;i2<=N;i2++){
    var d2 = DIMS[i2%N], a2 = angle(i2%N);
    var r2 = R*(s[d2]/MAX_SCORE)*prog;
    var x2 = cx+Math.cos(a2)*r2, y2 = cy+Math.sin(a2)*r2;
    if (i2) ctx.lineTo(x2,y2); else ctx.moveTo(x2,y2);
  }
  ctx.closePath();
  var grad = ctx.createLinearGradient(cx-R, cy-R, cx+R, cy+R);
  grad.addColorStop(0, 'rgba(124,108,255,.45)');
  grad.addColorStop(1, 'rgba(77,208,225,.35)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#8f7dff';
  ctx.lineWidth = 3;
  ctx.stroke();

  // 顶点圆点与分值
  for (var i3=0;i3<N;i3++){
    var d3 = DIMS[i3], a3 = angle(i3);
    var r3 = R*(s[d3]/MAX_SCORE)*prog;
    var x3 = cx+Math.cos(a3)*r3, y3 = cy+Math.sin(a3)*r3;
    ctx.beginPath(); ctx.arc(x3,y3,7,0,Math.PI*2);
    ctx.fillStyle = '#4dd0e1'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.fillStyle = '#eef1ff';
    ctx.font = '700 22px "PingFang SC","Microsoft YaHei",sans-serif';
    var off = 24;
    var vx = cx+Math.cos(a3)*(r3+off), vy = cy+Math.sin(a3)*(r3+off);
    ctx.fillText(String(s[d3]), vx, vy);
  }
}

/* ================= 事件绑定 ================= */
$('#btnStart').addEventListener('click', startQuiz);
$('#btnPrev').addEventListener('click', prevQ);
$('#btnNext').addEventListener('click', nextQ);
$('#btnRestart').addEventListener('click', function(){ showScreen('home'); });
